user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # Hide nginx version
    server_tokens off;

    # ─── Upstream ─────────────────────────────────────────
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────
    server {
        listen 80;
        server_name gwhyyy.com www.gwhyyy.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Main Server ────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name gwhyyy.com www.gwhyyy.com;

        # SSL certificates (replace with real certs from Let's Encrypt)
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── Uncomment below once you have SSL certs ──
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers off;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;
        # ssl_session_tickets off;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Next.js static assets — long cache
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_cache_valid 200 1y;
        }

        # Public static files
        location /public/ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }

        # Favicon and robots
        location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }

        # All other requests → Next.js
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }

    # ─── HTTP fallback (no SSL yet) ───────────────────────
    # Uncomment this block and comment the HTTPS server above
    # while you don't have SSL certificates yet:
    #
    # server {
    #     listen 80;
    #     server_name gwhyyy.com www.gwhyyy.com;
    #
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #
    #     location /_next/static/ {
    #         proxy_pass http://nextjs_app;
    #         add_header Cache-Control "public, max-age=31536000, immutable";
    #     }
    #
    #     location / {
    #         proxy_pass http://nextjs_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
