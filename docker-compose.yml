services:
  # ─── Next.js Application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gwhyyy_app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
    expose:
      - "3000"
    networks:
      - gwhyyy_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on: []

  # ─── Nginx Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: gwhyyy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - gwhyyy_net
    depends_on:
      - app

volumes:
  sqlite_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  gwhyyy_net:
    driver: bridge
